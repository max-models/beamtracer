[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools", "wheel" ]

[project]
name = "beamtracer"
version = "0.1.0"
description = "Steady ion beams in a self-consistent field: extraction, acceleration and charge changes."
readme = "README.md"
keywords = [ "ion optics", "beam extraction", "space charge", "negative ions", "neutral beam injection" ]
authors = [ { name = "Max" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
# PyPI rejects direct references (name @ git+...), so only version ranges go here; the
# max-models packages come from their devel branches through [tool.uv.sources]
dependencies = [
  # units of configuration files (imported only for a {value, unit} entry)
  "astropy",
  "cunumpy>=0.7.0",
  # MPI only under an MPI launcher; a serial stand-in for mpi4py otherwise
  "maybempi>=0.1",
  # the potential and charge density on the nodes (Field)
  "mpifield>=0.1.0",
  "numpy",
  # the charge-state transitions of a fast beam (ChargeChanging)
  "plasmacoll>=0.3.0",
  "scipy",
  "scope-profiler>=0.7.5",
  # the electrodes
  "simgeometry>=0.1.1",
  # boundary values given as expressions of x, y
  "sympy",
  # NodeField.evaluate
  "xarray",
]
optional-dependencies.neutralizer = [ "opencr", "wellbalanced[cr]>=0.1.0" ]
optional-dependencies.examples = [
  "matplotlib",
  "plasma-plots>=0.2.3",
  "plotly",
]
optional-dependencies.dev = [
  "jupyterlab",
  "pre-commit",
  "pyproject-fmt",
  "pyright",
  "ruff",
  "beamtracer[docs,examples,test]",
]
optional-dependencies.docs = [
  "griffe",
  "ipykernel",
  "matplotlib>=3.10.9",
  "nbclient>=0.11",
  "nbformat>=5.11.1",
  # the figures of the tutorials
  "plasma-plots>=0.2.3",
]
optional-dependencies.test = [ "beamtracer[neutralizer]", "pytest", "pytest-cov", "pyccel>2.0" ]
urls.Source = "https://github.com/max-models/beamtracer"

[project.entry-points."scope_profiler.opt_in_tags"]
beamtracer = "beamtracer"

[tool.setuptools]
package-data."*" = [ "py.typed" ]
# CUDA versions of the kernels (beamtracer.kernels.catalog)
package-data.beamtracer = [ "kernels/*/*_cuda.cu" ]
packages.find.where = [ "src" ]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-include = [ "*.ipynb" ]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear and pydocstyle
lint.select = [ "B", "D", "E", "F", "I", "UP", "W" ]
lint.ignore = [ "E501" ]  # line length is handled by the formatter
lint.per-file-ignores."**/tests/**" = [ "D" ]
lint.per-file-ignores."*.ipynb" = [ "D" ]
lint.per-file-ignores."docs/tools/*" = [ "D" ]
lint.pydocstyle.convention = "google"

[tool.pyright]
include = [ "src" ]
# the Pyccel kernels annotate in Pyccel's array dialect ("float[:]"), not Python typing;
# the examples are plotting scripts
exclude = [ "**/tests", "**/*_pyccel.py", "src/beamtracer/examples" ]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.pytest]
ini_options.pythonpath = [ "src" ]
ini_options.testpaths = [ "src" ]
ini_options.addopts = "-ra"

[tool.coverage]
run.omit = [ "*/tests/*" ]
run.source = [ "beamtracer" ]
report.show_missing = true

# PRs to devel test against the devel branches of the max-models packages (pinned in
# uv.lock); PRs to main and the release use PyPI only (CI sets UV_NO_SOURCES).
[tool.uv.sources]
# one entry per max-models package in [project], spelled exactly like this in every repo:
cunumpy = { git = "https://github.com/max-models/cunumpy", branch = "devel" }
maybempi = { git = "https://github.com/max-models/maybempi", branch = "devel" }
mpifield = { git = "https://github.com/max-models/mpifield", branch = "devel" }
opencr = { git = "https://github.com/max-models/opencr", branch = "devel" }
plasma-plots = { git = "https://github.com/max-models/plasma-plots", branch = "devel" }
plasmacoll = { git = "https://github.com/max-models/plasmacoll", branch = "devel" }
scope-profiler = { git = "https://github.com/max-models/scope-profiler", branch = "devel" }
simgeometry = { git = "https://github.com/max-models/simgeometry", branch = "devel" }
wellbalanced = { git = "https://github.com/max-models/wellbalanced", branch = "devel" }
