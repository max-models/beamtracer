name: Test Pytest

on:
  push:
    branches:
      - main
      - devel
  pull_request:
    branches:
      - main
      - devel

env:
  # A PR to main or a push to main (the release) uses PyPI versions only; devel uses the
  # devel branches from [tool.uv.sources].
  UV_NO_SOURCES: ${{ (github.base_ref || github.ref_name) == 'main' }}

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }}, ${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # fake-cupy runs the CuPy code paths (the kernels' CUDA dispatch) on cunumpy's
        # host-memory stand-in for CuPy
        backend: [numpy, fake-cupy]

    env:
      CUNUMPY_FAKE_CUPY: ${{ matrix.backend == 'fake-cupy' && '1' || '' }}
      CUNUMPY_BACKEND: ${{ matrix.backend == 'fake-cupy' && 'cupy' || 'numpy' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project
        run: uv sync --extra test

      - name: Check the backend
        run: uv run python -c "import cunumpy as xp; print(xp.get_backend()); assert xp.get_backend() == '${{ env.CUNUMPY_BACKEND }}'"

      - name: Run tests with coverage
        run: uv run pytest -p no:cacheprovider --cov --cov-report=xml --cov-report=term .

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python-${{ matrix.python-version }}-${{ matrix.backend }}
          fail_ci_if_error: false

  # PyPI rejects a release whose metadata has a direct reference (name @ git+...), so a pull
  # request to main fails here instead of the release after the merge.
  no-direct-references:
    if: (github.base_ref || github.ref_name) == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Check that the wheel has no direct references (name @ git+...)
        run: |
          uv build --wheel -o dist
          if unzip -p dist/*.whl '*.dist-info/METADATA' | grep -E '^Requires-Dist: [^;]*@'; then
            echo "::error::Requires-Dist has a direct reference; use a version range and [tool.uv.sources]"
            exit 1
          fi
